<div class="card employee-card h-100">
    <div class="card-body">
        <h2 class="h5">
            <a href="{% url 'employees:detail' employee.id %}">
                {{ employee.name|default:"ФИО не указано" }}
            </a>
        </h2>

        <p class="text-muted">
            {{ employee.position|default:"Должность не указана" }}
        </p>

        <a href="{% url 'employees:edit' employee.id %}"
           class="btn btn-outline-primary btn-sm">
            Редактировать
        </a>
    </div>
</div>
