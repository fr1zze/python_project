{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
    <div class="card form-card">
        <div class="card-body p-4">
            <h1>{{ title }}</h1>

            <form method="post">
                {% csrf_token %}

                {{ form.as_p }}

                <div class="d-flex flex-wrap gap-2 mt-4">
                    <button type="submit"
                            name="action"
                            value="save"
                            class="btn btn-primary">
                        Сохранить
                    </button>

                    <a href="{{ back_url }}"
                       class="btn btn-outline-secondary">
                        Отмена
                    </a>

                    {% if can_delete %}
                        <button type="submit"
                                name="action"
                                value="delete"
                                formnovalidate
                                data-confirm="Удалить сотрудника?"
                                class="btn btn-outline-danger ms-sm-auto">
                            Удалить сотрудника
                        </button>
                    {% endif %}
                </div>
            </form>
        </div>
    </div>
{% endblock %}
